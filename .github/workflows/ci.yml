name: CI

# Pushes to a PR branch fired both triggers, running every job twice.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same PR or branch instead of letting them
# pile up and starve each other of runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: ["a-l", "m-z"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Run tests (${{ matrix.group }})
        env:
          COVERAGE_FILE: .coverage.${{ matrix.group }}
        run: |
          if [ "${{ matrix.group }}" = "a-l" ]; then
            pytest tests/test_[a-l]*.py --tb=short -q --timeout=120 --timeout-method=thread --junitxml=junit-a-l.xml --cov --cov-branch --cov-report=
          else
            pytest tests/test_[m-z]*.py --tb=short -q --timeout=120 --timeout-method=thread --junitxml=junit-m-z.xml --cov --cov-branch --cov-report=
          fi

      - name: Upload test part
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-part-${{ matrix.group }}
          path: |
            junit-${{ matrix.group }}.xml
            .coverage.${{ matrix.group }}
          include-hidden-files: true
          retention-days: 1

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Download test parts
        continue-on-error: true # Still write an error report if no artifacts exist.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-part-*
          path: ci-parts
          merge-multiple: true
      - name: Combine coverage
        continue-on-error: true # Missing data must not prevent the fallback report.
        run: |
          pip install coverage
          python -m coverage combine ci-parts
          python -m coverage xml -o ci-parts/coverage.xml
      - name: Build AMI report
        env:
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_report.py --parts ci-parts --commit "$REPORT_COMMIT"
      - name: Upload AMI report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ami-ci-report
          path: ami-ci-report.json
          retention-days: 30

  # Every page and mode opened in headless Chromium; fails on JavaScript errors
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/smoke --tb=short -q --timeout=300 --timeout-method=thread
